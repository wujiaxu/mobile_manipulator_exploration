fkie_nbv_planner:
  ros__parameters:
    use_sim_time: true
    action_name: nbv_rrt
    world_frame: map
    robot_sampling_frame: base_link
    camera_pose_topic: /camera_pose
    octomap_topic: /octomap_full
    robot_footprint_topic: /mobile_manipulator_mbf/global_costmap/footprint

    num_frontiers: 10
    frontiers_N_max_tries: 50
    max_num_cached_points_to_keep: 50
    max_branch_nodes: 8
    max_known_free_marker_voxels: 5000
    max_known_occupied_marker_voxels: 50000
    max_unknown_marker_voxels: 10000
    min_gain_frontier: -10000.0
    free_space_frontier: true

    planner_boundary_id: 0
    arm_height_min: 0.15
    arm_height_max: 1.4
    self_collision_height: 2.0
    arm_goal_range: 1.3
    raycast_dr: 0.1
    raycast_dphi: 10.0
    raycast_dtheta: 10.0
    gain_r_min: 0.3
    gain_r_max: 1.5
    camera_hfov: 86.0
    camera_vfov: 57.0
    visited_cells_grid_size: 1.0
    min_distance_to_obstacle: 0.3
    compute_yaw_from_free_space: true
    compute_yaw_from_measurement: false

    path_optimizer_sampling_target_count: 1
    shift_points_max_length: 2.0
    shift_points_threshold: 0.9
    optimize_path_using_convex_hull: false
    optimize_path_using_sampling: false
    optimize_path_remove_points_inside_bbx: true
    optimize_path_shift_points_towards_obstacles: false

    rrt_tree_length: 600
    rrt_N_max_tries: 50
    rrt_sampling_radius: 30.0
    rrt_collision_cyl_radius: 0.3
    rrt_sample_threshold_distance: 0.4
    rrt_step_size: 0.5
    sample_in_unknown: true
    empty_octomap_resolution: 0.05
    do_rrt_star: false
    random_seed: 7

    utility_lambda: 5.0
    utility_min_gain: 0.0
    utility_weight_measurement: 0.0
    utility_weight_free_space: 5.0
    utility_weight_visited_cell: 500.0
    utility_weight_euclidean_cost: 0.5
    utility_max_value_free_space: 1.70
    utility_max_value_measurement: 500.0
    utility_max_value_visited_cell: 1.0

    planner_boundary_x: [-3.0, 3.0, 3.0, -3.0]
    planner_boundary_y: [-3.0, -3.0, 3.0, 3.0]
