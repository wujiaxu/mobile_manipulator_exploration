wrist_depth_octomap:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    cloud_topic: /wrist_camera/depth/points
    octomap_topic: /octomap_binary
    occupied_cloud_topic: /octomap_occupied_points
    resolution: 0.05
    max_range: 3.0
    min_z: 0.05
    max_z: 2.5
    transform_timeout: 0.5
    publish_every_n_clouds: 1
